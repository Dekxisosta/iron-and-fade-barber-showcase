<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fadeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#666666;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#1a1a1a" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Scissors (representing "Fade") -->
  <g transform="translate(30, 35)">
    <ellipse cx="5" cy="8" rx="4" ry="6" fill="#d4af37" opacity="0.9"/>
    <ellipse cx="5" cy="22" rx="4" ry="6" fill="#d4af37" opacity="0.9"/>
    <line x1="5" y1="8" x2="20" y2="15" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="22" x2="20" y2="15" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Razor blade (representing "Iron" - strong, sharp) -->
  <g transform="translate(50, 35)">
    <path d="M 0 5 L 15 0 L 20 10 L 15 25 L 0 20 Z" fill="url(#fadeGradient)" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="5" y1="10" x2="15" y2="7" stroke="#d4af37" stroke-width="0.8" opacity="0.6"/>
    <line x1="5" y1="15" x2="15" y2="12" stroke="#d4af37" stroke-width="0.8" opacity="0.6"/>
  </g>
  
  <!-- Initials -->
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#d4af37" text-anchor="middle">I&F</text>
</svg>
